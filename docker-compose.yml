# Сегменты (IP-план 10.<DC>.<сегмент>.<хост>, DC = 1):
#   edge-net  10.1.1.0/28  — публичный сегмент gateway
#   app-net   10.1.2.0/28  — сервисы (internal, без выхода наружу)
#   data-net  10.1.3.0/28  — БД, кэш, брокер (internal, без выхода наружу)
# Поверх сегментов на каждом контейнере свой файрвол (fw-* sidecar, iptables).

x-firewall: &firewall
  build: ./firewall
  image: slot-booking-fw
  cap_add: [NET_ADMIN]
  restart: "no"

services:
  # ---------- Gateway segment ----------
  apigw:
    image: nginx:1.27-alpine
    container_name: booking-apigw
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"          # единственный опубликованный порт
    networks:
      edge-net: { ipv4_address: 10.1.1.2 }
      app-net:  { ipv4_address: 10.1.2.2 }
    depends_on:
      app:    { condition: service_healthy }
      fw-app: { condition: service_completed_successfully }

  fw-apigw:
    <<: *firewall
    network_mode: "service:apigw"
    command: ["apigw"]

  # ---------- App segment ----------
  app:
    build: .
    image: slot-booking
    container_name: booking-app
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379
      RABBITMQ_HOST: rabbitmq
    networks:
      app-net:  { ipv4_address: 10.1.2.3 }
      data-net: { ipv4_address: 10.1.3.3 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:    { condition: service_healthy }
      redis:       { condition: service_healthy }
      rabbitmq:    { condition: service_healthy }
      fw-postgres: { condition: service_completed_successfully }
      fw-redis:    { condition: service_completed_successfully }
      fw-rabbitmq: { condition: service_completed_successfully }

  fw-app:
    <<: *firewall
    network_mode: "service:app"
    command: ["app"]

  notifier:
    build: .
    image: slot-booking
    container_name: booking-notifier
    # Только то, что нужно сервису: без паролей от БД и Redis
    environment:
      MODE: notifier
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      data-net: { ipv4_address: 10.1.3.4 }
    depends_on:
      rabbitmq:    { condition: service_healthy }
      fw-rabbitmq: { condition: service_completed_successfully }

  fw-notifier:
    <<: *firewall
    network_mode: "service:notifier"
    command: ["notifier"]

  # ---------- Data segment ----------
  postgres:
    image: postgres:17-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      data-net: { ipv4_address: 10.1.3.10 }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  fw-postgres:
    <<: *firewall
    network_mode: "service:postgres"
    command: ["postgres"]

  redis:
    image: redis:7-alpine
    container_name: booking-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      data-net: { ipv4_address: 10.1.3.11 }
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  fw-redis:
    <<: *firewall
    network_mode: "service:redis"
    command: ["redis"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: booking-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      data-net: { ipv4_address: 10.1.3.12 }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  fw-rabbitmq:
    <<: *firewall
    network_mode: "service:rabbitmq"
    command: ["rabbitmq"]

networks:
  edge-net:
    name: booking-edge-net
    ipam:
      config: [{ subnet: 10.1.1.0/28 }]
  app-net:
    name: booking-app-net
    internal: true
    ipam:
      config: [{ subnet: 10.1.2.0/28 }]
  data-net:
    name: booking-data-net
    internal: true
    ipam:
      config: [{ subnet: 10.1.3.0/28 }]

volumes:
  pgdata:
