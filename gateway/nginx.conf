# API gateway: единственная точка входа снаружи + балансировка между репликами app.

# Формат лога для расчёта SLI (доступность и задержка): scripts/sli-report.sh
log_format sli 'status=$status method=$request_method uri=$uri rt=$request_time '
               'up=$upstream_addr ust=$upstream_status';

upstream booking_app {
    # Пассивная проверка здоровья: после 2 ошибок реплика исключается на 10 с.
    # IP вместо имён: nginx стартует, даже если одна реплика ещё не поднялась.
    server 10.1.2.3:8080 max_fails=2 fail_timeout=10s;   # app-1
    server 10.1.2.4:8080 max_fails=2 fail_timeout=10s;   # app-2
    keepalive 16;
}

server {
    listen 80;
    server_tokens off;            # не раскрываем версию nginx
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log sli;

    location / {
        proxy_pass http://booking_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;

        # Если реплика упала или ответила 502/503, запрос уходит на другую.
        # POST повторяется, только если не дошёл до реплики (nginx не дублирует
        # неидемпотентные запросы) — двойной брони не будет.
        proxy_next_upstream         error timeout http_502 http_503;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 5s;
    }
}
